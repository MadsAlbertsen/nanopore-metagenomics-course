name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff pyyaml
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q  # includes the headless-browser test (Chrome is on the runner)
      - run: python build.py

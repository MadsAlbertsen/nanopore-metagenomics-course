# Guided examples for module 2 (assembly). Each example sets up one simulation (state) and asks one question; the
# answer stays hidden until clicked. All three simulations use fixed seeds, so a state always gives the same result;
# every number below was read off the page in headless Chrome (2026-10-31). check.py rejects unknown keys or values.
# state keys: go = section (repeat, steps, strains); rl = read length (kb, 1-30); rep = repeat length (kb, 1-10);
#   step = step of the toy assembly (1-6); id = identity between the strains (%: 100, 99.99, 99.9, 99.5, 99, 98, 97,
#   95); cova, covb = depth of strain A (2-40) and B (1-40); err = read substitution errors (%: 0, 0.5, 1, 2, 3).

- title: Reads shorter than the repeat
  state: {go: repeat, rl: 5, rep: 6}
  question: >-
    Reads of 5 kb, a repeat of 6 kb in two copies. How many contigs does the toy assembler make, and why? Then move
    the read length up one step at a time: at which length does the genome first come out as one contig?
  answer: >-
    Four contigs: the unique pieces A, B and C, and the repeat R once, with both copies merged into one node. No 5 kb
    read can cover 6 kb of repeat plus 1 kb on each side. At 8 kb a read could just do it, but only if it starts at
    exactly one position, and none does. At 9 kb copy 1 is spanned by 1 read and copy 2 by 4: one contig of 60 kb.

- title: Long enough, but by chance not spanned
  state: {go: repeat, rl: 15, rep: 10}
  question: >-
    Now the repeat is 10 kb and the reads are 15 kb, longer than the repeat. Why are there still 3 contigs? What
    changes at 20 kb?
  answer: >-
    Copy 1 is spanned by 3 reads, copy 2 by none. A 15 kb read spans copy 2 only if it starts within a 3 kb window;
    with 40 reads placed at random, about 2.7 would be expected there, and here none landed in it. A read has to be
    long enough and also lie in the right place, so depth matters too. At 20 kb copy 1 is spanned by 4 reads and
    copy 2 by 1: one contig.

- title: Transitive edges
  state: {go: steps, step: 4}
  question: >-
    Step 4 of the toy assembly. The table lists all 14 overlaps. Which ones are removed as transitive, and why is
    what is left a single chain?
  answer: >-
    Five are removed: A-C (via B), B-D (via C), C-E (via D), D-F (via E) and F-H (via G). Two more (B-X, C-X) went
    with the contained read X in step 3. The 7 left (A-B, B-C, C-D, D-E, E-F, F-G, G-H) link each read to one
    neighbour on each side, so the graph has no branches: one unitig, which becomes one 24 kb contig in step 6.

- title: Two strains, two rules
  state: {go: strains, id: 99.5, cova: 20, covb: 10, err: 1}
  question: >-
    Two strains 99.5% identical (150 differences in 30 kb), strain A at 20x and strain B at 10x, reads with 1%
    substitution errors. Compare the two rules: what does each make of the 180 reads?
  answer: >-
    The mismatch-tolerant rule joins all 180 reads into one mixed group: 0.5% difference plus errors stays well
    under its 5% limit, so the strains collapse. The variant-aware rule finds 140 of the 150 true differences (and 66
    false ones from read errors) and makes one group of strain A and one of strain B, with no joins between the
    strains; 6 reads are left unjoined.

- title: A rare strain
  state: {go: strains, id: 99.5, cova: 20, covb: 2, err: 1}
  question: >-
    Same strains, but strain B drops to 2x. How many of the differences does the variant-aware rule find now, and
    what happens to strain B's reads?
  answer: >-
    Only 44 of the 150 differences are found: most are covered by two or fewer strain B reads, too few to see the
    second base on both strands and pass the test. With little depth the test also lets through 111 false positions
    from read errors. Strain B gets no group of its own: most reads (108 of strain A and 10 of strain B) end up in one
    mixed group, 2 strain A reads form a small group, and 12 reads are left unjoined. A strain needs enough depth
    before its differences can keep it apart.

- title: Too many read errors
  state: {go: strains, id: 99.5, cova: 20, covb: 10, err: 3}
  question: >-
    Back to 10x for strain B, but now the reads have 3% substitution errors. What happens to both rules?
  answer: >-
    Both break up. The tolerant rule now often exceeds its 5% limit (two reads with 3% errors each differ at about 6%
    of positions): 59 reads are left unjoined. The variant-aware rule finds 750 false variant positions from shared
    errors, and an error at any variant position blocks an overlap: 158 of 180 reads are left unjoined. This toy
    lacks myloasm's protections (a base-quality check at variant positions and relaxed thresholds where no exact
    matches exist). myloasm also compares 21-letter words, so an error elsewhere only loses one match instead of
    blocking the overlap. 3% errors is the limit of what myloasm is documented for (reads above about 97% accuracy).

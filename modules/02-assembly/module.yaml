number: 2
slug: assembly
title: 'Assembly: from overlapping reads to contigs'
nav: Assembly
summary: How a long-read assembler such as myloasm turns overlapping reads into a graph and contigs, and what repeats
  and closely related strains do to that graph.
status: draft
takeaways:
- An assembler never sees where a read came from, only which reads overlap; contigs are paths through the graph those
  overlaps make.
- A read that runs through a whole repeat into unique sequence on both sides settles it; a repeat that no read happens
  to span ends the contig, so read length and depth both matter.
- In the toy, a mismatch-tolerant rule merged two strains 99.5% identical; a variant-aware rule kept them apart only with
  enough depth per strain and accurate reads. myloasm finds such positions with pairs of k-mers that differ in one base.
- 'Read accuracy matters: myloasm is documented for reads of about 97% accuracy or better.'
discussion: Two strains of one species share 99.5% of their sequence. What decides whether an assembler gives you one
  contig or two, and which would you want for your own question?
teacher:
  time: About 45 minutes (an estimate, not yet tried with students).
  before: Students should know what a read is and that reads carry errors (module 1, or a short recap).
  flow:
  - '5 min: why assembly is hard (no positions, repeats, strains); show the run''s numbers at the top of the page.'
  - '15 min: section 1 with examples 1 and 2; let students move the read-length slider before opening the answers.'
  - '10 min: section 2, stepping through reads to contig together; example 3 on transitive edges.'
  - '10 min: section 3 with examples 4-6 on strains, depth and read errors.'
  - '5 min: the table of what myloasm does, then the discussion question.'
  discussion_points:
  - 'One contig per strain needs differences the assembler can trust: enough positions that differ, enough reads per strain,
    and reads accurate enough that true differences stand out from errors (examples 4-6).'
  - 'Which is wanted depends on the question: a merged contig is fine for ''is this species there?'', separate strains
    matter for gene content or tracking a strain over time.'
  - 'Link forward: module 3 shows two MAGs of one species (2.441 and 3.1230), and module 4 a contig that is two-part.'
  pitfalls:
  - The simulations are illustrations with toy rules, not myloasm's code; the 'What myloasm does' table is the source-based
    part.
  - Longer reads help only when some read actually spans the repeat; depth matters too (example 2).
  - A circular contig is the assembler's decision, not proof of a whole chromosome.

# Guided examples for module 3 (assembly). Each example sets up one simulation (state) and asks one question; the
# answer stays hidden until clicked. All three simulations use fixed seeds, so a state always gives the same result;
# every number below was read off the page in headless Chrome (2026-10-31). check.py rejects unknown keys or values.
# state keys: go = section (repeat, steps, strains); rl = read length (kb, 1-30); rep = repeat length (kb, 1-10);
#   step = step of the toy assembly (1-6); id = identity between the strains (%: 100, 99.99, 99.9, 99.5, 99, 98, 97,
#   95); cova, covb = depth of strain A (2-40) and B (1-40); err = read substitution errors (%: 0, 0.5, 1, 2, 3).

- title: Reads shorter than the repeat
  at: repeat
  state: {go: repeat, rl: 5, rep: 6}
  question: >-
    Reads of 5 kb, a repeat of 6 kb in two copies. How many contigs does the toy assembler make, and why? Then move
    the read length up one step at a time: at which length does the genome first come out as one contig?
  answer: >-
    Four contigs: the unique pieces A, B and C, and the repeat R once, with both copies merged into one node. No 5 kb
    read can cover 6 kb of repeat plus 1 kb on each side. At 8 kb a read could just do it, but only if it starts at
    exactly one position, and none does. At 9 kb copy 1 is spanned by 1 read and copy 2 by 4: one contig of 60 kb.

- title: Long enough, but by chance not spanned
  at: repeat
  state: {go: repeat, rl: 15, rep: 10}
  question: >-
    Now the repeat is 10 kb and the reads are 15 kb, longer than the repeat. Why are there still 3 contigs? What
    changes at 20 kb?
  answer: >-
    Copy 1 is spanned by 3 reads, copy 2 by none. A 15 kb read spans copy 2 only if it starts within a 3 kb window;
    with 40 reads placed at random, about 2.7 would be expected there, and here none landed in it. A read has to be
    long enough and also lie in the right place, so depth matters too. At 20 kb copy 1 is spanned by 4 reads and
    copy 2 by 1: one contig.

- title: Transitive edges
  at: steps
  state: {go: steps, step: 4}
  question: >-
    Step 4 of the toy assembly. The table lists all 14 overlaps. Which ones are removed as transitive, and why is
    what is left a single chain?
  answer: >-
    Five are removed: A-C (via B), B-D (via C), C-E (via D), D-F (via E) and F-H (via G). Two more (B-X, C-X) went
    with the contained read X in step 3. The 7 left (A-B, B-C, C-D, D-E, E-F, F-G, G-H) link each read to one
    neighbour on each side, so the graph has no branches: one unitig, which becomes one 24 kb contig in step 6.

- title: Two strains, two rules
  at: strains
  state: {go: strains, id: 99.5, cova: 20, covb: 10, err: 1}
  question: >-
    Two strains 99.5% identical (150 differences in 30 kb), strain A at 20x and strain B at 10x, reads with 1%
    substitution errors. Compare the two rules: what does each make of the 180 reads?
  answer: >-
    The mismatch-tolerant rule joins all 180 reads into one mixed group: 0.5% difference plus errors stays well
    under its 5% limit, so the strains collapse. The variant-aware rule finds 140 of the 150 true differences (and 66
    false ones from read errors) and makes one group of strain A and one of strain B, with no joins between the
    strains; 6 reads are left unjoined.

- title: A rare strain
  at: strains
  state: {go: strains, id: 99.5, cova: 20, covb: 2, err: 1}
  question: >-
    Same strains, but strain B drops to 2x. How many of the differences does the variant-aware rule find now, and
    what happens to strain B's reads?
  answer: >-
    Only 44 of the 150 differences are found: most are covered by two or fewer strain B reads, too few to see the
    second base on both strands and pass the test. With little depth the test also lets through 111 false positions
    from read errors. Strain B gets no group of its own: most reads (108 of strain A and 10 of strain B) end up in one
    mixed group, 2 strain A reads form a small group, and 12 reads are left unjoined. A strain needs enough depth
    before its differences can keep it apart.

- title: Too many read errors
  at: strains
  state: {go: strains, id: 99.5, cova: 20, covb: 10, err: 3}
  question: >-
    Back to 10x for strain B, but now the reads have 3% substitution errors. What happens to both rules?
  answer: >-
    Both break up. The tolerant rule now often exceeds its 5% limit (two reads with 3% errors each differ at about 6%
    of positions): 59 reads are left unjoined. The variant-aware rule finds 750 false variant positions from shared
    errors, and an error at any variant position blocks an overlap: 158 of 180 reads are left unjoined. This toy
    lacks myloasm's protections (a base-quality check at variant positions and relaxed thresholds where no exact
    matches exist). myloasm also compares 21-letter words, so an error elsewhere only loses one match instead of
    blocking the overlap. 3% errors is the limit of what myloasm is documented for (reads above about 97% accuracy).

# Examples 7-13 use the real graph (sections 4 and 5; data.json from np26 scripts/28_course_assembly.py).
# state keys: g = piece of the graph (circle, closing, repeats, strains, copri, shared, second, largest);
#   col = colour (mag, depth); node = a selected node of that piece. Numbers checked on data.json (2026-11-01).

- title: A genome as one loop
  at: real
  state: {go: graphs, g: circle}
  question: >-
    This piece of the graph is a single node with one link. Where does the link go, and what does that say about
    the genome? How complete is the MAG made from it, and is a loop enough to call a genome complete?
  answer: >-
    The link runs from the contig's end back to its own start (an overlap of 23 kb), so the 1.91 Mb contig closes
    into a circle; myloasm marks it circular-yes. mmlong2 took it as a MAG on its own (c.34, Zag111 sp002102825),
    100% complete with 0.3% contamination by CheckM2. A loop is the assembler's decision; CheckM2's estimate is an
    independent check, and here both agree. 110 of the 122 loops of 1 Mb or more stand alone like this one.

- title: A contig left out of its MAG
  at: real
  state: {go: graphs, g: closing, node: u10633016ctg}
  question: >-
    The selected 94 kb contig is in no MAG. Which MAG does the graph tie it to, and what other evidence on the page
    points the same way?
  answer: >-
    Its two ends overlap the two ends of the 2.02 Mb contig that is MAG s.171 (51-20 sp001917175), by 22.6 and 24.5
    kb, so together they make a loop. myloasm gives both the same depth (418x and 416x); the read depth that binning
    used is lower for the small contig (369x against 482x), as expected when reads from the shared ends are split
    between the two. mmlong2's contig taxonomy gives it the same species, and its depth over the ten days follows
    the MAG's contig more closely than any other of the 4,400 contigs of 50 kb or more (r = 0.994). So it likely
    belongs to the same genome. It could not join the MAG: mmlong2 1.2.1 makes a MAG from a single contig of 1 Mb or
    more before binning when CheckM2 finds it complete enough (here 96.3%), and takes that contig out of binning.

- title: A repeat at twice the depth
  at: real
  state: {go: graphs, g: repeats, col: depth}
  question: >-
    MAG 1.19 is six contigs, all in this piece of the graph. Coloured by depth, which node stands out, and what could
    it be? Compare with the repeat in section 1.
  answer: >-
    The six contigs of the MAG have depths of 7-11x. The removed node u13177708ctg (21 kb) has 17x, about twice
    that, and links to two of them and to a short contig in no MAG. A stretch present twice in the genome gives
    twice the depth and is merged
    into one node, so the contigs around it cannot continue: the same as the merged repeat node in section 1. The
    graph alone does not prove that it is a repeat; the depth and the links fit one.

- title: Strains kept apart
  at: real
  state: {go: graphs, g: strains}
  question: >-
    How many MAGs are in this piece, and of which species? How similar are the three long contigs, and how does
    that compare with what section 3 showed for the two rules?
  answer: >-
    Four MAGs, all Streptococcus thermophilus; three are a single contig of 1.83-1.87 Mb. These align to each other
    over 93-97% of their length, and 86-94% of their bases match. Counting only substitutions the aligned parts are
    99.0-99.4% identical; counting insertions and deletions too, 88-94%. The toy's mismatch-tolerant rule (up to
    5% substitutions) would merge them
    (section 3); myloasm kept them apart, as its documentation says it can down to about 99% identity, and only
    their ends are linked. Their depths over the ten days do not all follow each other (r = 0.28 to 0.92).

- title: One genome or two?
  at: real
  state: {go: graphs, g: copri}
  question: >-
    Two MAGs of Prevotella copri_B sit in one piece of the graph. What links them, and what do the alignment and
    the depth over the days say? Can the graph decide whether they are one population or two strains?
  answer: >-
    They are linked directly (an 18.7 kb overlap between 2.359's contig and one of 3.5197's) and through four nodes
    that myloasm removed, all at about 2,000x like the contigs. The 1.49 Mb contig of MAG 3.5197 aligns to the
    single contig of MAG 2.359 over 87% of its length, and 84% of its bases match (99.3% identity counting
    substitutions only, 90% counting insertions and deletions too). The two follow each other over the ten days
    almost exactly (r = 0.999). So much of 3.5197 is a second version of
    2.359's genome that rises and falls with it. The graph cannot say whether these are two strains that always
    move together or variants within one population.

- title: Where a split contig sits
  at: real
  state: {go: graphs, g: largest, node: u28510213ctg}
  question: >-
    The selected contig is in the largest group. Why are nodes of two MAGs ringed, and does the graph show which MAG
    the contig belongs to?
  answer: >-
    mmlong2 split this 447 kb contig: positions 1-299,380 are in MAG 3.1230, 311,106-447,366 in MAG 2.441, and the
    12 kb between them in no MAG. Both MAGs are Hominiventricola filiformis, and five contigs of each are in this
    group. In the graph the contig links only to two short nodes that lead on to other MAGs (2.209 and s.173), not
    to the contigs of 2.441 or 3.1230, so the graph does not settle it. Module 4 shows the same two MAGs from the
    binning side.

- title: Small circles
  at: circles
  state: {go: circles}
  question: >-
    How many of the small circular contigs (under 100 kb) are in a MAG, compared with those of 1 Mb or more? Why
    might binning leave them out?
  answer: >-
    Of 398 small circles, mmlong2 keeps 343 and only 12 of these are in a MAG; 8 of the 12 are only "possibly"
    circular and 1 is a piece of a circle mmlong2 split. Of the 246 whole contigs marked circular-yes, 3 are in a
    MAG. Of the 122 loops of 1 Mb or more, 121 are in a MAG, though mmlong2 split 6 of them. Binning groups contigs
    by depth and composition, and a plasmid or phage can differ from its host in both: copy number changes its
    depth. Some small circles also have very little depth (45 of the 398 at 2x or less). Module 6 tries to place
    such contigs by their methylation.

# Examples 14-16: section 6, misassemblies. state keys: go = misjoin (toy) or splits (our run); mk = toy case (join,
#   gap); mx = share of the reads at the join that truly run across (%: 0, 5, 10, 20, 50); sp = a contig mmlong2 cut
#   (data.json splits.rows). Toy numbers read off the page in headless Chrome, real ones from data.json (2026-11-02).

- title: How many reads must be clipped?
  at: misjoin
  state: {go: misjoin, mk: join, mx: 0}
  question: >-
    The toy contig joins genome A (20x) to genome B (8x). How many of the reads at the join are clipped there, and
    does mmlong2's rule cut? Then move "Reads that truly run across" up step by step: when does the rule stop cutting?
  answer: >-
    All 24 reads that reach the join are clipped there (18 from genome A, 6 from genome B): 100%, so the contig is
    cut. With 5% of the reads running across, 23 of 24 are clipped (96%); with 10%, 22 of 24 (92%): still cut. With
    20%, 19 of 24 are clipped (79%), below the 90% the rule needs, and the join stays in the contig. The depth also
    changes at the join (about 21x against 9x here), but mmlong2's rule does not use depth.

- title: Two genomes in one contig
  at: misassembly
  state: {go: splits, sp: u30930981ctg}
  question: >-
    myloasm made u30930981ctg, 3.33 Mb. mmlong2 cut it in two. What tells you that the two pieces come from two
    different genomes, and what happened to them in binning?
  answer: >-
    The first piece (positions 1 to 2,363,361; 2.36 Mb) has a read depth of 119x, the second (2,363,363 to 3,330,204;
    967 kb) 32x, nearly four times less. Metabuli places them in two genera, Agathobacter and Maccoya, and binning put
    them in two MAGs whose GTDB names agree: 1.222 (Agathobacter sp905209075) and 1.986 (Maccoya intestinihominis),
    both of high quality by CheckM2 (100% and 99.9% complete). The pieces are 2.36 of the 3.52 Mb of MAG 1.222 and
    967 kb of the 2.72 Mb of MAG 1.986. Without the cut, the whole 3.33 Mb contig could only have gone into one MAG.

- title: Same depth, different genus
  at: misassembly
  state: {go: splits, sp: u36397268ctg}
  question: >-
    Here the two pieces of u36397268ctg have almost the same read depth. Would depth alone have shown that this
    contig joins two genomes? What does?
  answer: >-
    No: the first piece (2.17 Mb) has 17.5x, the second (452 kb) 19.6x, a ratio of 1.1. The genus does: Metabuli
    places the first piece in Faecalibacterium and the second in Enterocloster, and binning put them in MAGs 2.671
    (Faecalibacterium sp934533135, high quality, 93.6% complete) and 3.3941 (Enterocloster sp000431375, medium
    quality, 56.1% complete). The cut itself came from the reads: mmlong2's rule looks only at clipping and gaps
    without reads, so it caught this join although depth gives no hint of it.

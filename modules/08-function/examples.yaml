# Guided examples for module 8 (function: genes and what they may do). Each example sets the page up (state) and asks one question; the answer
# stays hidden until clicked. Every number was computed from the example analysis (np26 scripts/29_course_annotation.py
# data: GTDB-Tk summaries and Bakta tables; 2026-11-01) and recomputed by an independent review (2026-11-01). check.py rejects names
# not in data.json.
# state keys: mag = MAG in the card; map = MAG in the gene map; ctg = contig; pos = window start (bp); win = window
#   width in kb (10, 20, 50); q = search text (product, gene symbol or Pfam domain); amr = resistance gene in the table;
#   lv = test MAG in the leave-out chart (empty: all four); inc = test MAG and meth = removal (blocks, pieces) in the
#   incomplete-MAG chart; col = tree colouring (clade, product, phylum); tq = search in the tree; prod = Bakta name
#   marked in the tree.
# Examples 3-7 (sections 3-6) use np26 scripts/62-66 (2026-11-12).

- title: An archaeon in a bacterial annotation tool
  at: genemap
  state: {mag: "c.14", map: "c.14", q: "MCR_alpha"}
  question: >-
    Open Methanocatella smithii (MAG c.14), the only archaeon, a circular 1.79 Mb genome. What share of its genes is
    hypothetical? Look at the two search hits for MCR_alpha and their neighbours in the gene map.
  answer: >-
    1,610 of 1,786 CDS (90.1%) are hypothetical, the highest share of all MAGs; only 176 got a name. The search
    finds two hypothetical proteins with the Pfam domains of methyl-coenzyme M reductase alpha (MCR_alpha), at
    1.04 and 1.15 Mb, each next to genes with MCR_gamma and MCR_beta domains: the enzyme that releases methane in
    methanogens. In the same window, genes with elongation factor, ribosomal protein and RNA polymerase domains are
    hypothetical too. Bakta was designed for bacteria, and its protein clusters do not name these archaeal proteins;
    the Pfam domains show what they are. GTDB-Tk, which has archaeal markers, names this genome to species at 99.33%
    ANI.

- title: A placeholder species
  at: hyp
  state: {mag: "c.100", map: "c.100"}
  question: >-
    Open MAG c.100 (CAG-417 sp000432835), a circular 1.31 Mb genome. Its species name is well supported (module 7).
    How much of its gene content is known? Compare with Bacteroides caccae (MAG 1.308).
  answer: >-
    Its name rests on 98.36% ANI and AF 0.896 to the species' reference genome. But the species
    has no published Latin name, hence the placeholder name, and 907 of its 1,347 CDS (67.3%) are hypothetical
    against 16.8% in B. caccae. Its order RF39 has a placeholder name too. MAGs with a placeholder name have a median
    of 45% hypothetical, those with a Latin name 24% (the chart's first rows).

- title: Two tools on the same genes
  at: tools
  state: {}
  question: >-
    Which test MAG has the largest share of genes that only Bakta names? And when both tools name a gene, how often do
    they mean the same function?
  answer: >-
    Phocaeicola dorei (MAG c.66): 1,873 of its 4,333 CDS (43.2%) get a Bakta name but no KO, against 29.7-35.0% in the
    other three. Genes with a KO but no Bakta name are rare (1.3-5.0%). A Bakta name counts here even when it is only a
    domain or family; a KO needs a score above the profile's own threshold. Of 200 random genes named by both, 127 have
    the same function, 49 have a vaguer Bakta name, 13 a vaguer KO, and 11 two different functions, such as FtsA
    (cell division) against PilM (type IV pili): related proteins in different systems.

- title: A whole order missing from the database
  at: leave
  state: {lv: "c.109"}
  question: >-
    Choose Desulfovibrio piger_A (MAG c.109). With its whole order removed from the reference database, how many of its
    genes still get their own KO from the best remaining match, and how similar is that match?
  answer: >-
    1,194 of its 1,245 genes with a KO (95.9%) keep it, from best matches with a median identity of 50.5%. 11 (0.9%) get
    another KO, 24 a match without a KO and 16 no match. With only the species removed, 99.6% keep their KO at a median
    of 97.6% identity. Compare module 7: there, with the species removed, most windows got a confident, wrong species
    name. For the genes KOfam can label, a function is shared far more widely than a species name.

- title: How low can the identity go?
  at: leave
  state: {}
  question: >-
    In the right-hand chart, how often does a gene keep its KO when its best match is only 20-30% identical, and when it
    is 90-100% identical?
  answer: >-
    204 of 235 genes (86.8%) at 20-30% identity, 5,559 of 5,582 (99.6%) at 90-100%. Even distant matches mostly carry
    the same KO here, but these are genes KOfam can label at all, mostly conserved families, pooled over all removal
    levels. A low identity is no guarantee: 31 of the 235 lost their KO.

- title: A pathway in a 70% complete genome
  at: incomplete
  state: {inc: "c.62"}
  question: >-
    Choose Bifidobacterium adolescentis (MAG c.62). With 30% of its genome removed in 10 kb blocks, how many of its 28
    complete modules look incomplete, and which pathway is lost most often? Then switch to whole pieces.
  answer: >-
    On average 58.9% of them, from 39.3% to 78.6% over the 100 draws (11 to 22 of the 28 modules). The pentose phosphate
    pathway (M00004) looks incomplete in 94 of 100 draws: it has many steps, and the rule needs all of them. With whole
    pieces removed the mean is 53.1% (32.1-75.0%). So in a 70% complete MAG, a missing pathway is expected even when the
    organism has it.

- title: Named penicillin amidase, closest to a bile salt hydrolase
  at: tree
  state: {col: "product", prod: "Penicillin amidase Cysteine peptidase MEROPS family C59"}
  question: >-
    Bakta names 27 of the full-length genes "Penicillin amidase". Where do they sit in the tree, and what does the tree
    call them? Hover the marked genes.
  answer: >-
    All 27 are from Bacteroidota MAGs. 14 come out as BSH: Bacteroides and Phocaeicola genes 74.3-99.7% identical to
    BT2086 of B. thetaiotaomicron, a measured BSH. 13 stay unresolved, at 54.0-67.0% identity to it (Parabacteroides,
    Alistipes, Muribaculaceae, Butyricimonas and some Bacteroides). The two B. thetaiotaomicron MAGs (1.931 and s.76)
    each carry two such genes: one 99.1-99.7% identical to BT2086, the other 54.0%. One name covers both.

- title: Far from every measured enzyme
  at: tree
  state: {col: "clade", prod: "Choloylglycine hydrolase/NAAA C-terminal domain-containing protein"}
  question: >-
    18 genes carry Bakta's name "Choloylglycine hydrolase/NAAA C-terminal domain-containing protein". What does the tree
    say about them, and how close is their nearest measured enzyme?
  answer: >-
    All 18 stay unresolved. 17 are from Bacteroidota MAGs, one from an Oscillospiraceae MAG. Their nearest reference is
    only 30.2-38.9% identical (11 closest to the Clostridium perfringens BSH, 4 to the Bacillus subtilis PVA). So far
    from every enzyme with a measured activity, neither the tree nor the identity can tell what they do; the name
    itself says only which domain they carry.

- title: A name from a distant relative
  at: genemap
  state: {map: "c.32", mag: "c.32", pos: 244000, q: "flagellin"}
  question: >-
    Open Butyrivibrio_A crossota (MAG c.32), one circular contig, also in module 5. The window shows a gene
    named Flagellin and a hypothetical protein next to it. How strong is the evidence for each?
  answer: >-
    The gene at 252,506-253,732 is named Flagellin by a UniRef50 cluster match at 51% identity to the cluster's
    representative, just above Bakta's 50% floor. The next gene (254,026-255,240) matched no cluster and stays
    hypothetical, but carries the Pfam domain Flagellin_C. Both point to flagellin-like proteins; neither says which
    flagellin or whether it is made. Half of all cluster matches in the 421 MAGs are below 62.6% identity.

- title: A resistance gene and its neighbours
  at: genemap
  state: {mag: "1.717", map: "1.717", q: "Tet(W)"}
  question: >-
    Open Scatosoma sp900552625 (MAG 1.717), also in module 5. Where is its tetracycline resistance gene, how strong
    is the evidence, and what lies around it?
  answer: >-
    tet(W) sits on contig u9907485ctg (236 kb) at 5,808-7,727, named by AMRFinderPlus from a reference resistance
    protein; its cluster match is 98% identical. Nearby are genes named after mobile-element functions: a
    MobA/VirD2-like nuclease and a conjugative transposon-like helix-turn-helix domain within 6 kb, and a hypothetical
    protein with resolvase and recombinase domains at 15.8 kb. That fits a mobile element but does not prove one,
    and the gene's presence does not show that the bacterium resists tetracycline. tet(W) is the most common match:
    46 genes in 42 MAGs.

- title: What module 6's flagged contigs carry
  at: genemap
  state: {mag: "2.167", map: "2.167", ctg: "u6615594ctg", q: "Elongation factor G"}
  question: >-
    Open Dorea formicigenerans (MAG 2.167). Module 6 flags its two small contigs (178 and 175 kb) because their
    methylation differs from the main contig. Do their genes settle whether they belong?
  answer: >-
    Both are mostly named: 43 of 159 and 22 of 160 CDS are hypothetical. u6615594ctg carries a cluster of cobalamin
    (vitamin B12) synthesis genes and a gene named Elongation factor G (66% identity). The main contig already has two genes
    named Elongation factor G (85% and 66% identity), so another gene with this name is not by itself a sign of a
    second genome. Gene names do not settle it; module 5's single-copy marker genes
    (CheckM2) and module 6's methylation are made for this question.

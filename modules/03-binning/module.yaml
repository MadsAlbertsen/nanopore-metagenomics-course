number: 3
slug: binning
title: 'Binning: sorting contigs into genomes'
nav: Binning
summary: The features binners use to group contigs into genomes (depth in each sample, GC, tetranucleotides, methylation),
  shown as maps you can explore, and how well each feature keeps a genome together.
status: ready
mag_link: '#?mark={id}'
takeaways:
- 'Binners group contigs by features that differ between genomes: depth in each sample and sequence composition (GC, tetranucleotides).'
- 'One or two numbers per contig are not enough: with GC and pooled depth, 16% of a contig''s nearest contigs are in its
  own MAG; with all features together, 88%.'
- Depth across several samples separates genomes that look alike in GC and total depth, but only when each sample has
  enough reads.
- Tetranucleotides separate distant genomes, not close relatives, and are noisy for short contigs.
- Nanopore reads add methylation, a signal of its own that can differ between strains of one species (MAGs 2.441
  and 3.1230, module 4).
- The scores measure agreement with the binners, not whether the MAGs are right.
discussion: GTDB places MAG 2.441 and MAG 3.1230 in one species (Hominiventricola filiformis). What evidence would
  you want before moving a contig from one to the other, or splitting it?

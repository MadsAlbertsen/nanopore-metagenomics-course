number: 3
slug: binning
title: 'Binning: sorting contigs into genomes'
nav: Binning
summary: The features binners use to group contigs into genomes (depth in each sample, GC, tetranucleotides, methylation),
  shown as maps you can explore, and how well each feature keeps a genome together.
status: ready
mag_link: '#?mark={id}'
takeaways:
- 'Binners group contigs by features that differ between genomes: depth in each sample and sequence composition (GC, tetranucleotides).'
- 'One or two numbers per contig are not enough: with GC and pooled depth, 16% of a contig''s nearest contigs are in its
  own MAG; with all features together, 88%.'
- Depth across several samples separates genomes that look alike in GC and total depth, but only when each sample has
  enough reads.
- Tetranucleotides separate distant genomes, not close relatives, and are noisy for short contigs.
- Nanopore reads add methylation, a signal of its own that can differ between strains of one species (MAGs 2.441 and 3.1230,
  module 4).
- The scores measure agreement with the binners, not whether the MAGs are right.
discussion: GTDB places MAG 2.441 and MAG 3.1230 in one species (Hominiventricola filiformis). What evidence would you
  want before moving a contig from one to the other, or splitting it?
teacher:
  time: About 60 minutes (an estimate, not yet tried with students).
  before: Contigs and depth (module 2 and the glossary). No statistics needed beyond 'nearest neighbours'.
  flow:
  - '5 min: the binning problem: thousands of contigs, no labels; what differs between genomes.'
  - '10 min: examples 1 and 2 (GC and pooled depth are not enough; depth in two samples separates look-alikes).'
  - '10 min: the depth-over-the-days chart with example 3; let students draw around a group on the depth map and look
    at its lines.'
  - '15 min: examples 4 and 5 (rare genome: composition helps; close relatives: depth helps), then the score table.'
  - '10 min: examples 6 and 7 (short contigs; two strains and methylation).'
  - '10 min: take-home points and the discussion question.'
  discussion_points:
  - 'Evidence the binners did not already use is worth most: in example 7, methylation and the change in depth over time
    both point the same way; module 4 adds methylation in 100 kb windows (read support does not settle this case).'
  - Module 4 shows that contig u3347900ctg is two-part by methylation, so the honest options are to split it or to leave
    it flagged; moving the whole contig would be wrong.
  - 'Ask what a wrong decision would cost: likely more for claims about which genes a strain has than for its abundance.'
  pitfalls:
  - 't-SNE maps keep neighbours, not distances: gaps and group sizes mean little.'
  - The score is agreement with the binners, which were built from the same features, not proof of correct MAGs.
  - Depth per sample depends on how much each sample was sequenced; the depth chart divides by Gb sequenced for that reason.
  - Drawing around dots needs a mouse or trackpad; on phones the maps can be viewed but selecting is awkward.

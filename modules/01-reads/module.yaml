number: 1
slug: reads
title: "Raw reads: what they look like, and why we filter and split them"
nav: Raw reads
summary: >-
  The structure of a read for rapid and ligation library preps, read length and quality, adapters, joined reads that
  need splitting, and what filtering costs.
status: draft
takeaways:
  - "A rapid barcoding read starts with the end of the sequencing adapter and a barcoded tag (front flank, barcode,
    50-base rear flank) before the genome. Here the barcode sorting step had already cut that region off most reads: in
    72% of mapped reads without the tag the genome starts within 10 bases of the read start, and 6% of the sampled
    reads still carried the full rear flank."
  - "Count both reads and bases. The analysis's filter (mean Q 10, 1,000 bp) removed 40% of the sampled reads but only
    11% of their bases, because most removed reads are short; the full run kept 166.9 of about 185 Gb."
  - "Removed reads mostly come from the same genomes: most of them align to the co-assembly, and the low-quality ones
    less often. Kept reads align almost completely (99.8%), 81% of their bases to MAG contigs."
  - "Quality is lower over the first and last bases of a read and where an adapter meets the genome; trimming adapters
    costs very few bases (0.13% of the kept bases in the sample, 0.25% in the full run)."
  - "About 2 in 1,000 kept reads hold a middle adapter where two molecules were read as one, sometimes from two
    genomes. Splitting at adapters catches these, but not joins without a recognisable adapter."
discussion: >-
  The filter removed 40% of the reads but 11% of the bases. Which of the two numbers matters for assembling genomes,
  and which for counting how abundant each genome is from read counts?
teacher:
  time: About 60 minutes (an estimate, not yet tried with students).
  before: What a nanopore read and a quality score are; no other module needed. Module 2 (assembly) uses the kept reads.
  flow:
    - "10 min: what is on a read (section 1) and the read starts base by base (section 2, example 5)."
    - "20 min: length and quality, and what the filter costs (section 3, examples 1-4)."
    - "10 min: do removed reads belong to the genomes, and what trimming removes (sections 4 and 5)."
    - "15 min: joined reads (section 6, examples 6 and 7)."
    - "5 min: take-home points and the discussion question."
  discussion_points:
    - "For assembly, bases matter: the 11% of bases removed are mostly in short or poor reads that add little to
      overlaps, and depth is reduced by about that share. Read counts matter where reads are counted, for example
      abundance from reads per genome: then a filter that removes 40% of reads, and more of them in some samples (DNA02
      59%), changes the numbers unless every sample is treated alike."
    - "Short and low-quality reads still align mostly to MAG contigs, so the filter does not remove a group of
      organisms; whether it removes some unevenly (genomes whose DNA breaks into short pieces) these data do not test."
  pitfalls:
    - "Mean Q of a read is computed from the mean error probability, not the mean of the Q scores; the two differ, and
      an average over many reads is pulled down by the poorest ones."
    - "The sampled reads come from the full read files including reads below Q 10; numbers for the run as delivered by
      a sequencing service, which often holds only reads that passed, would differ."
    - "Porechop_ABI's trimming numbers differ between the samples here (14-40% of reads trimmed at the start) and the
      full run (25-43%): it picks the adapter sets it searches for from the reads it is given."
    - "This module shows rapid barcoding reads only. Ligation reads carry adapters at both ends; a ligation data set
      is still to come."

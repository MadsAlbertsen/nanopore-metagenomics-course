# Guided examples for module 6 (methylation). Each example sets the page up (state) and asks one question; the answer
# stays hidden until clicked. Every number was computed from the example analysis (np26 scripts/26_course_methylation.py
# data: motif screen, window screen, per-window motif counts, read check, breakpoints and placement with depth and
# composition checks; 2026-10-31) and still needs the independent check. check.py rejects names not in data.json.
# state keys: mag = MAG shown in the fingerprint and track; win = contig whose per-window motif counts are shown;
#   contig = contig in the placement card; pset = circular, unbinned, control, absent; pshow = trusted, depth, comp,
#   both, placed, all; plen = all, short, mid, long.

- title: A clean fingerprint
  state: {mag: "1.308"}
  question: >-
    Open: Bacteroides caccae (MAG 1.308), 7 contigs at about 66x. Look at the fingerprint: do the contigs carry the
    same motifs? Which contig looks different, and does the screen flag it?
  answer: >-
    Nanomotif found four motifs for this MAG (CGAGG and GATGG 6mA, GAGCTG and MAGCTB 5mC). In five of the six large
    contigs they are methylated at 79-98% of sites. u12568325ctg (308 kb) is lower for every motif (59-71%), but it is
    not flagged: 59% for GAGCTG lies between the lines for methylated (60% or more) and unmethylated (25% or less),
    and such partial values never count as a conflict. All 7 contigs and all 50 windows are consistent. Why one contig
    is less methylated (a strain mixture gives partial values, for example) the data here does not show.

- title: A contaminant contig
  state: {mag: "2.167"}
  question: >-
    Open: Dorea formicigenerans (MAG 2.167), high quality, one 2.86 Mb contig and two of about 175 kb. Compare the
    rows of the fingerprint. What do the two small contigs lack, and what do they carry?
  answer: >-
    The main contig has CCTGC 5mC methylated at 67% of 6,127 sites and GACNNNGTC 6mA at 1% of 555. Both small contigs
    (178 and 175 kb) are the other way round: CCTGC at 0% (369 and 401 sites) and GACNNNGTC at 82-83% (34 and 52
    sites). Two conflicting motifs flag each of them as lacking the MAG's motif. In a test run on 2% of the reads,
    Nanomotif's own contamination module flagged the same two contigs, a second method (it also flagged a 182 kb
    contig in MAG 1.356 that this screen finds consistent). The MAG is still high quality
    by CheckM2: marker genes need not notice 350 kb of something else. Which organism the two contigs come from is not
    settled here.

- title: One contig, two parts
  state: {mag: "2.441", win: u3347900ctg}
  question: >-
    Open: MAG 2.441 (Hominiventricola filiformis) and the per-window table of contig u3347900ctg below the track. The
    screen flags the whole contig for an extra motif. What do the windows add?
  answer: >-
    In its first three windows (0-300 kb), AYGAGGC 6mA is methylated at 31 of 35, 27 of 32 and 10 of 12 sites (as in
    MAG 3.1230, the other H. filiformis MAG) and 2.441's own motif CNAAAGC at 0 of 34, 43 and 42. From 300 kb on it is
    reversed: CNAAAGC 24 of 26 and 35 of 35, AYGAGGC 0 of 11 and 0 of 13. The change lies at about 368 kb (366-375 kb).
    7 of 19 reads cross the nearby window edge, and there is no clipping peak, but a join between two strains of one
    species would leave few clipped reads anyway. So the first ~368 kb looks like 3.1230 and the rest like 2.441: the
    question is a split, not moving the contig, and reads cannot settle it.

- title: A placement the test gets right
  state: {mag: "2.250", pset: control, pshow: both, contig: u12683734ctg}
  question: >-
    The list shows the known-answer test: binned contigs taken out of their MAG and placed as if unbinned. Open:
    u12683734ctg (180 kb) from Anaerostipes hadrus (MAG 2.250). Where does it go, on how many motifs, and do depth and
    composition agree?
  answer: >-
    Back to its own MAG. It shares 5 methylated motifs with the rest of 2.250, 3 of them distinct: ACATNNNNNCTGT and
    ACAGNNNNNATGT (one motif read on both strands), CTGCAG and its longer form CTGCAGT, and GGCC; no other MAG fits. Its depth follows the rest of
    its MAG best of all 421 MAGs (r = 0.988, rank 1), and composition ranks the MAG second. A contig of 50 kb or more
    sharing 2 or more motifs, with both checks passed, is the kind of placement the analysis trusts.

- title: A wrong placement that depth catches
  state: {mag: "2.569", pset: control, pshow: placed, contig: u14159146ctg}
  question: >-
    Open: u14159146ctg (1.54 Mb), binned in Hominicoprocola fusiformis (MAG 2.569). Methylation alone puts it in
    another MAG. Which one, on what evidence, and what do depth and composition say?
  answer: >-
    It goes to SIG351 sp905210525 (MAG 2.158) on one shared motif, TTTAAA 6mA. MAG 2.158 has 4.2x depth, 41 contigs
    and no Nanomotif motifs, so few of its motifs are known and almost nothing can conflict. Without this contig, the
    rest of 2.569 is mixed for TTTAAA (92% of 53 sites methylated in u10205617ctg, 25% of 61 in the 552 kb
    u4227186ctg), so no motif of it counts as known methylated and it shares nothing with the contig. Depth disagrees clearly: the
    contig follows 2.158 with r = -0.649 (rank 412 of 421) and its own MAG with r = 0.977 (rank 1); composition ranks
    2.158 at 270. In the test, placements on only one shared motif (all forms counted) were wrong in 39 of 142 cases (27%; 26% when
    one distinct motif is counted, as in the table).

- title: A circular contig with every kind of support
  state: {mag: c.71, pset: circular, pshow: depth, contig: u24259230ctg}
  question: >-
    The list now shows circular contigs that binning left out, placed with depth support. Open: u24259230ctg (293 kb,
    circular). Where is it placed, which motifs does it share, and how does its depth compare with the MAG's?
  answer: >-
    In Roseburia_D yibonii (MAG c.71, itself one circular contig, high quality). It is methylated at 8 motifs, all of
    them also methylated in c.71, 4 of them distinct (CCAGG, CCTGG, CCWGG and GNCCAGG are forms of one; GGCGCC is a
    form of RGCGCY). They cover all four of c.71's Nanomotif motifs (GACGAG, TGATCA, CCWGG, RGCGCY); no other MAG fits. Depth follows c.71 best of all MAGs (r =
    0.999) at about the same level (173.5x against 168.4x), and composition also ranks c.71 first. The same depth fits
    about one copy per genome copy; what the element is (plasmid, phage or other) is not shown here.

- title: Methylation fits, depth does not
  state: {mag: "2.126", pset: circular, pshow: placed, contig: u4270247ctg}
  question: >-
    Open: u4270247ctg (43.5 kb, circular), placed by methylation alone. How many motifs does it share with its MAG,
    and what do the two other checks say?
  answer: >-
    It is placed in CAG-238 sp900551415 (MAG 2.126) on 4 shared methylated motifs, 3 of them distinct (AGYNNNNNNNTCCA
    and TGGANNNNNNNRCT are one motif read on both strands, CAAAAA and CSACTG): three of 2.126's five Nanomotif
    motifs; no other MAG fits.
    But its depth runs against the MAG's (r = -0.373, rank 354 of 421) and composition ranks 2.126 at 82. A changing
    plasmid copy number would make the depth check miss a true placement; a mobile element in another cell with the
    same motifs would give the same picture. Methylation fits; whether it belongs is not settled, so it is not trusted.

- title: Only common motifs
  state: {mag: "1.308", pset: unbinned, pshow: all, plen: short, contig: u30498981ctg}
  question: >-
    Open: u30498981ctg (11.4 kb), not in a MAG. Which motifs are methylated in it, and why is it not placed?
  answer: >-
    Only GGATC and RGATCY 6mA: both forms of GATC, so in effect one motif, and GATC is in the motif lists of 45 MAGs. 28 MAGs fit it without a
    conflict, and the best of them share 2 motifs each, so there is a tie and nothing is placed. Of the 871 unbinned
    contigs that end in a tie, 357 are methylated only at motifs that contain GATC. Common motifs say the contig is
    compatible with many genomes, not which one it came from.

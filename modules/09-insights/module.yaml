number: 9
slug: insights
title: "What this data set can tell us: ten days in one gut"
nav: Insights
summary: >-
  An example analysis with the whole data set: how the genomes' shares change over the ten days and the diet switch,
  what long reads gave, what the genomes that rose or fell could digest, and what one person's time series can and
  cannot show. Ends with open questions.
status: draft
mag_link: "#?mag={id}"
takeaways:
  - "Abundance here is a share of each day's read bases. Shares are relative: when one genome falls, every other share
    rises. Samples were sequenced to very different amounts (1.7-25.6 Gb), so compare shares, not raw read bases."
  - "The days 6-10 differ from days 1-5, but the days also differ within each period: Bray-Curtis dissimilarity 0.21
    and 0.24 on average within the periods, 0.31 between them."
  - "Of the 124 MAGs with a mean of 0.1% or more of the read bases, 23 are two-fold higher in days 6-10 and 12 two-fold
    lower. Ranking hundreds of MAGs always turns up some large changes: look at the single days, not only the means."
  - "Long reads gave whole genomes: 102 of the 421 MAGs are one circular contig, such as Zag111 sp002102825 (MAG c.34,
    1.91 Mb), a little-known relative of the cyanobacteria that rose from 0.20-0.36% of the read bases on days 1-6
    to 5.1% on day 10."
  - "Genes are potential, not activity. Five of the six MAGs that fell in days 6-10 carry plant-fibre enzymes, while
    five of the six risers have few or none; but the fallers are all Bacillota and the risers mostly other phyla, so
    the difference may follow phylum rather than diet."
  - "One person with one sample per day cannot separate the diet from time: anything else that changed over the ten
    days would look the same."
discussion: >-
  Design a study that could tell whether the diet caused the changes seen here. What would you change, and what would
  it cost in samples and sequencing?
teacher:
  time: About 75 minutes (an estimate, not yet tried with students).
  before: 'MAGs and depth (modules 4 and 5). The study design: one person, one sample per day, diet change after day 5.
    Students need no earlier work with the data: the page is meant as a first look at what the whole data set can show.'
  flow:
  - '5 min: the design and what it can answer; how abundance is measured (share of read bases).'
  - '10 min: examples 1-3 (who dominates, how much is in MAGs, sequencing effort is not abundance).'
  - '15 min: examples 4-6 (two MAGs going opposite ways, day-to-day variation, other ways to split the days).'
  - '10 min: examples 7 and 8 (a noisy rare MAG, shares are not amounts).'
  - '5 min: what long reads gave (example 9: a circular genome that rose late).'
  - '15 min: who could do what (examples 10-13): how genes are found and grouped by food, a known answer (Bacteroides),
    butyrate genes, and the MAGs that do not fit.'
  - '10 min: open questions (last section): pairs pick two and report back; there is no single right answer.'
  - '5 min: take-home points and the discussion question.'
  discussion_points:
  - 'To go from potential to activity: faecal short-chain fatty acids (butyrate, propionate) and RNA or protein from the
    same samples would show which genes were used on which days.'
  - 'To attribute changes to the diet: several people, a cross-over design (each person gets both diets in random order),
    several samples per period, and ideally a measure of total microbial load so shares can be turned into amounts.'
  - 'Costs grow with people and samples: sequencing per sample, and the depth each sample needs for rare genomes (module
    4''s example ''Too few reads for depth'').'
  - 'What this data set can still do well: describe one person''s community and its day-to-day variation, and give a yardstick
    for planning a larger study.'
  pitfalls:
  - 'The comparison of all 126 ways to split the days is a yardstick, not a statistical test: the days are in time order.'
  - Shares are relative; a fall in one large genome raises every other share (example 8).
  - Ranking hundreds of MAGs always produces some large changes; look at single days, not only means.
  - 'A CAZyme family''s food category comes from characterised enzymes of the family; one gene can act on something
    else. Read the categories as a rough guide, and the counts as potential, not as what was digested on these days.'
  - 'The 17 MAGs were chosen by a rule fixed before looking at their genes (largest changes among high-quality MAGs).
    The most abundant MAG (Prevotella copri_B 2.359, medium quality) and a second P. copri_B (3.5197, 5th), both about 1.9-fold lower, are in no group; the sixth
    faller beat the seventh by a hair (log2 -1.378 against -1.376).'
  - 'Risers and fallers differ in phylum (fallers all Bacillota, risers mostly not): a gene that separates the groups
    may only be separating phyla.'
  - 'Literature expectations (Duncan et al. 2007; David et al. 2014) come from other people and other diets: here only
    carbohydrate and calories were recorded.'

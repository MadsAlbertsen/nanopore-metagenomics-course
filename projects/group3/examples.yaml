# Guided examples for group 3. Numbers in {braces} are filled from data.json (numbers, or {mag:ID:field} from a MAG's
# row) by project.js; check.py rejects any key, MAG or setting not in data.json.
# state keys: view (genes, sets); hset (all or a gene set); hscale (share, log2); series (community, per1000, mag);
#   mag (MAG number of a route MAG with mean >= 0.1%); hl (MAG number to enlarge in Figure 3).

- title: How many MAGs could make butyrate?
  at: genes
  state: {view: genes}
  question: >-
    How many of the {n_mags} MAGs carry bcd, and how many of those also carry a final step (a complete route)? Why is
    the bcd count only an upper bound?
  answer: >-
    {n_bcd} MAGs carry bcd and {n_route} of them have a complete route ({n_route_hq} of those are high quality). Of the
    {bcd_total} genes the bcd profile finds, Bakta names {bcd_butyryl} "butyryl-CoA dehydrogenase", {bcd_short}
    "short-chain specific acyl-CoA dehydrogenase", {bcd_acyl} plain "acyl-CoA dehydrogenase" and {bcd_other} something
    else: the profile covers a family of related enzymes. The partner genes (Etf) sit within three genes of bcd in
    {n_etf_route} of the {n_route} route MAGs.

- title: Which final step is most common?
  at: genes
  state: {view: sets}
  question: >-
    Which gene set is the most common among the route MAGs, and how many route MAGs reach butyrate only through the
    kinase route (ptb/buk, without but)?
  answer: >-
    "{top_set}" in {top_set_n} of {n_route} route MAGs. {n_type_pb} route MAGs have only ptb and/or buk, and
    {n_type_but} have but (some of them also buk). So the CoA-transferase is the more common final step here, as
    Vital et al. (2014) found for the acetyl-CoA pathway in stool.

- title: The CoA-transferase MAGs fall
  at: heat
  state: {hset: "bcd + but", hscale: log2}
  question: >-
    Look at the bcd + but MAGs in log2 change from days 1-5. Which MAGs turn blue after the diet switch, and from which
    day?
  answer: >-
    Of the {bb_main} rows, {bb_below} drop below their range of days 1-5 on some day of 6-10 and {bb_above} rise above
    it, so this group mostly falls, but not every member. Agathobacter rectalis (c.40) has its first day below the range of days 1-5 on
    day {mag:c.40:first} and falls by log2 {mag:c.40:log2} overall; Roseburia intestinalis (1.406) on day
    {mag:1.406:first} (log2 {mag:1.406:log2}). Summed, the MAGs with but went from {but_hi_pct}% to {but_lo_pct}% of the
    sample's bases.

- title: The kinase MAGs rise
  at: heat
  state: {hset: "bcd + ptb + buk", hscale: share}
  question: >-
    Now the bcd + ptb + buk MAGs, coloured by share. Which MAG is largest, and does it rise or fall?
  answer: >-
    Acetatifactor intestinalis (c.33): {mag:c.33:hi}% of the bases on days 1-5 and {mag:c.33:lo}% on days 6-10 (log2
    {mag:c.33:log2}), first above the range of days 1-5 on day {mag:c.33:first}. It is the largest single gain of any
    route MAG ({up1_pp} percentage points). Its bcd sits next to Etf genes, which fits a working butyryl-CoA
    dehydrogenase.

- title: Same genes, same family?
  at: pcoa
  state: {hl: c.33}
  question: >-
    Do the MAGs at one spot of the map belong to one family? Compare the Lachnospiraceae with the Oscillospiraceae.
  answer: >-
    Only partly. Lachnospiraceae sit at two spots: {lachno_but} have bcd + but and {lachno_pb} bcd + ptb + buk (such as
    the enlarged c.33). bcd + but + buk is mainly Oscillospiraceae ({oscillo_butbuk}). Of all pairs of route MAGs,
    {pairs_all}% are from one family; among pairs with the same gene set {pairs_same}%, among pairs with different sets
    {pairs_other}%. The gene set says little about the family.

- title: When does the total change?
  at: line
  state: {series: community}
  question: >-
    Does the summed share of the route MAGs change after the diet switch? And the two final-step groups?
  answer: >-
    The total barely moves: {total_hi}% on days 1-5 and {total_lo}% on days 6-10, and no day falls outside the range of
    days 1-5. The MAGs with but fall (log2 {tbut_diet_log2} at the diet switch, first below on day {tbut_first}); the
    ptb/buk-only MAGs rise (log2 {tpb_diet_log2}, first above on day {tpb_first}), so the two cancel.

- title: One known producer
  at: line
  state: {series: mag, mag: c.40}
  question: >-
    Follow Agathobacter rectalis (c.40). Where is its break, and is it at the diet switch?
  answer: >-
    Break after day {mag:c.40:brk} (log2 {mag:c.40:brk_log2} between the blocks), one day after the switch; first
    day below the range of days 1-5: day {mag:c.40:first}. Over the route MAGs with a mean of at least {min_mean}%,
    {break_diet_n} have their break at the diet switch, {break_late_n} later and {break_early_n} earlier.

number: 1
slug: project-group1
title: "Does the gut community answer the diet switch with a delay?"
nav: "Group 1: timing and strains"
question: >-
  After the switch from a high-carbohydrate, high-calorie diet (days 1-5) to a low-carbohydrate, low-calorie diet
  (days 6-10), on which day does the community change, and are day 1 and day 10 the most alike? And which of the MAGs
  present on every day look like mixtures of strains?
status: draft
data_note: >-
  Data: ten daily stool samples from one person (our own sequencing run of the ten samples), analysed with mmlong2.
  Shares are percent of a sample's bases on a MAG (a share of the DNA, not a cell count). Variable positions come from
  the reads of all ten days pooled.
takeaways:
  - "The community does not jump on the day of the switch: day 7 lies between the two states, and from day 8 on the samples are clearly different from the first days."
  - "Day 1 and day 10 are among the most different pairs of days, not the most alike."
  - "None of the MAGs present on every day stands out as a strain mixture by its share of variable positions; telling strains apart day by day needs each day's reads mapped on their own."
discussion: >-
  Is a delay of one to two days what you would expect from the time food takes through the gut, or from the time a
  community takes to change? What measurement could tell the two apart?

- title: "Which substrate group moves most?"
  at: cat
  question: "Switch to 'Relative to days 1-5'. Which of the four substrate groups ends up furthest from its days 1-5 level, and by how much does its mean over days 6-10 differ?"
  answer: "Host glycans: {cat_host_glycan_first|1} genes per 1,000 genes on average in days 1-5 and {cat_host_glycan_second|1} in days 6-10, a change of {cat_host_glycan_pct|0|+}%. Fructan changes by {cat_fructan_pct|0|+}%, starch by {cat_starch_pct|0|+}% and plant fibre by {cat_plant_fibre_pct|0|+}%. All four stay within a narrow band, likely because many MAGs carry these families: the community's potential changes much less than its species mix."
  state: {cat: rel, highlight: "Host glycans"}
- title: "The day that sorts wrong"
  at: sort
  question: "With the species mix, which day is sorted into the wrong period, and which day of days 1-5 is the closest call?"
  answer: "Day {taxa_wrong}: its bar is {taxa_margin_6|3}, so it is closer to the days 1-5 average than to the other days 6-10. Day 6 is the first day of the new diet and the species mix has not changed much yet. The closest call in days 1-5 is day 4 ({taxa_margin_4|3}), nearly as close to days 6-10 as to its own period. In all, {taxa_correct} of 10 days are sorted right."
  state: {sort: taxa}
- title: "Genes instead of species"
  at: sort
  question: "Switch to the genes. How many days are sorted right now, and which ones go wrong? Compare the size of the bars with the species mix."
  answer: "{func_correct} of 10 are right; days {func_wrong} go wrong, the same day 6 plus day 4, which was already the closest call with species. The bars are several times shorter (for example day 8: {func_margin_8|3} against {taxa_margin_8|3} with species): the gene profiles of all days are much more alike. A second distance (Hellinger) gives the same {hel_func_correct} of 10, wrong days {hel_func_wrong}."
  state: {sort: functions}
- title: "Is days 6-10 less stable?"
  at: stab
  question: "In the bottom chart, compare days 1-5 with days 6-10 for all pairs and for neighbouring days. What changes when day 6 is left out (days 7-10)?"
  answer: "All pairs: {first_taxa_all_mean|3} for days 1-5 against {second_taxa_all_mean|3} for days 6-10, so the second period's days differ more. Neighbouring days: {first_taxa_cons_mean|3} against {second_taxa_cons_mean|3}, about the same. Without day 6, all pairs of days 7-10 give {late_taxa_all_mean|3}, close to days 1-5. The second period is not jumpier from day to day; it drifts, and day 6 (still like days 1-5) adds to the spread. In the heatmap, days 8-10 are the most different from days 1-5."
  state: {stab: taxa}
- title: "The family that rose most"
  at: fam
  question: "Which family rises most from days 1-5 to days 6-10, and which MAG carries most of it?"
  answer: "{fam_up} ({fam_up_cat}): {fam_up_first|2} → {fam_up_second|2} genes per 1,000 genes, log2 change {fam_up_log2|2}. In days 6-10, {fam_up_mag} contributes {fam_up_mag_pct|0}% of its weighted genes. The largest drop is {fam_down} ({fam_down_cat}, log2 {fam_down_log2|2}), the largest part from {fam_down_mag} ({fam_down_mag_pct|0}% in days 1-5). None of the listed families separates the periods cleanly: the days of the two periods overlap in all of them."
  state: {}

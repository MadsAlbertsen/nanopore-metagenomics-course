number: 5
slug: project-group5
title: "Bifidobacterium angulatum: its genes and its share over ten days"
nav: "Group 5: B. angulatum"
question: >-
  Which functions do the genes of Bifidobacterium angulatum predict, carbohydrate metabolism in particular, and how
  does its relative abundance vary over the ten days, across the switch from a high- to a low-carbohydrate diet? In
  the group's own format: goal, research question and hypothesis, a graph of the share in percent, a table per
  sample and an annotated gene map.
status: draft
data_note: >-
  Data: ten daily stool samples from one person, sequenced on one PromethION flow cell (Oxford Nanopore, Rapid
  Barcoding Kit, R10.4.1), analysed with mmlong2, Bakta and the dbCAN protein models. Every number on this page comes
  from np26 scripts/45_project_group5.py; diet details are information from the data owner.
takeaways:
  - "The B. angulatum genome is one circular contig of 1.99 Mb (CheckM2 completeness 99.95%) with 1,564 protein-coding genes, 83 of them with a carbohydrate role (Table 3)."
  - "It carries 39 carbohydrate-degrading enzyme genes in 20 families, more than the median MAG for starch (11 against 5) and plant fibre (12 against 3), plus 12 sugar transporter parts and a phosphoketolase, the bifid-shunt enzyme."
  - "Its share of the bases fell from a mean of 0.128% on days 1-5 to 0.07% on days 6-10 (log2 -0.8), as the group predicted, but it varied strongly between days (CV 76% and 136%)."
  - "The share rose 5.9-fold within days 1-5 on an unchanged diet, peaked on day 5 and dropped most from day 6 to day 7 (log2 -2.24); the step across the diet switch was small (log2 -0.31)."
  - "Counting reads directly in a random read sample (positive control against the base shares passed) also found the most reads on days 5-6, but with 0-9 reads per sample (22 of 18,070 pooled) too few to show the day-to-day pattern."

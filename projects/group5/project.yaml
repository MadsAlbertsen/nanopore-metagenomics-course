number: 5
slug: project-group5
title: "Bifidobacterium angulatum: its genes and its share over ten days"
nav: "Group 5: B. angulatum"
question: >-
  What can the genome of Bifidobacterium angulatum in this gut do, carbohydrate-active enzymes in particular, and does
  its share of the DNA fall after the switch from high- to low-carbohydrate food? One complete genome, compared with
  the two other Bifidobacterium genomes of the study.
status: draft
data_note: >-
  Data: ten daily stool samples from one person, sequenced on one PromethION flow cell (Oxford Nanopore, Rapid
  Barcoding Kit, R10.4.1), analysed with mmlong2, Bakta and the dbCAN protein models. Every number on this page comes
  from np26 scripts/45_project_group5.py; diet details are information from the data owner.
takeaways:
  - "The B. angulatum genome is one circular contig of 1.99 Mb (CheckM2 completeness 99.95%) with 1,564 protein-coding genes."
  - "It carries 39 carbohydrate-degrading enzyme genes (median MAG 38) in a smaller genome; GH13, a starch family, is the largest with 9 genes (39 of 421 MAGs have more)."
  - "A broad carbohydrate repertoire: more genes than the median MAG for plant fibre (12 against 3) and starch (11 against 5), but fewer plant-fibre genes than its two relatives (20 and 23)."
  - "Its mean share fell from 0.128% of the bases on days 1-5 to 0.07% on days 6-10 (log2 -0.8), but it rose 5.9-fold within days 1-5 on an unchanged diet and peaked on day 5: the peak is not explained by the diet switch."
  - "Like its relatives, it carries a phosphoketolase and a gene named bile salt hydrolase/transferase; it also has 7 CRISPR-associated genes and 5 CRISPR arrays."
